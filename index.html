:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172033;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#f4f5f7ed;backdrop-filter:blur(16px);padding:calc(16px + env(safe-area-inset-top)) 20px 12px;z-index:10;border-bottom:1px solid #e4e7ed}h1{font-size:24px;margin:0 0 4px}small,.muted{color:#748094}.wrap{max-width:650px;margin:auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}.card{background:white;border-radius:18px;padding:17px;margin:0 0 12px;box-shadow:0 2px 10px #19283b08}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#eff3f9;border-radius:999px;padding:5px 10px;font-size:12px;color:#516783}.primary{background:#2665e8;color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:650}.ghost{background:#eef2f8;color:#183454;border:0;border-radius:12px;padding:10px 13px}.danger{color:#bf3446}.full{width:100%}input:not([type=file]),select,textarea{width:100%;background:white;border:1px solid #d9dfea;border-radius:12px;padding:12px;outline:none}textarea{min-height:210px;resize:vertical;line-height:1.8}label{display:block;font-size:13px;color:#5e6b7d;margin:14px 0 7px}nav{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid #e6eaf0;display:flex;gap:12px;z-index:20}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#f4f5f7;color:#56657b}nav button.active{background:#e0eafe;color:#2059cc;font-weight:700}.title{font-size:17px;font-weight:650}.preview{white-space:pre-line;color:#64748b;font-size:13px;line-height:1.6;max-height:38px;overflow:hidden}.article{white-space:pre-wrap;line-height:1.95;word-break:break-word;font-size:18px}.images img{width:100%;display:block;border-radius:9px;margin:0 0 13px}.switch{display:flex;gap:7px;background:#e7ebf1;border-radius:14px;padding:5px}.switch button{border:0;border-radius:10px;flex:1;padding:11px;background:transparent}.switch .active{background:white;font-weight:700;box-shadow:0 2px 4px #0001}.hidden{display:none!important}.empty{text-align:center;color:#718096;padding:65px 10px}.sub{font-size:13px;color:#728095}.imageThumb{width:70px;height:86px;object-fit:cover;border-radius:10px;background:#f0f2f6}.thumbRow{display:flex;gap:10px;overflow:auto}.thumbRow img{height:100px;border-radius:9px}.tip{background:#eef4ff;padding:12px;border-radius:12px;font-size:13px;color:#425b83;line-height:1.6}.back{background:none;border:0;color:#2764da;padding:0;margin-bottom:12px}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:99;max-width:90vw;text-align:center}
</style></head><body><header><div style="max-width:650px;margin:auto"><h1 id="heading">日语阅读手帐</h1><small id="subtitle">把每一篇阅读留在这里</small></div></header><main class="wrap" id="app"></main><nav id="nav"><button data-page="list" class="active">📚 文章库</button><button data-page="new">＋ 添加文章</button><button data-page="review">📝 复习</button><button data-page="settings">⚙️ 设置</button></nav><div id="toast"></div><script>
'use strict';const DB='nihongo-reader-01', STORE='articles', PAPERS='papers';let perPageOCR=[], db, page='list', activeId=null, readMode='text', photos=[], originalPhotoUrls=[], fontSize=18, ocrWorker=null, ocrRunning=false;
const $=s=>document.querySelector(s), app=$('#app');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const note=t=>{let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2700)};
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}function txStore(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}async function all(){return (await request(txStore().getAll())).sort((a,b)=>b.updated-a.updated)}async function one(id){return request(txStore().get(id))}async function put(a){return request(txStore('readwrite').put(a))}async function del(id){return request(txStore('readwrite').delete(id))}
async function paperNames(){return (await request(db.transaction(PAPERS).objectStore(PAPERS).getAll())).map(x=>x.name).sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}))}
async function addPaper(name){name=name.trim();if(!name)throw Error('请输入试卷名称');await request(db.transaction(PAPERS,'readwrite').objectStore(PAPERS).put({name}));return name}
async function askPaper(){const name=prompt('新试卷名称（例如：试卷三）');if(name===null)return null;try{return await addPaper(name)}catch(e){note(e.message);return null}}
function navigate(p,id){page=p;activeId=id??null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#heading').textContent=p==='list'?'日语阅读手帐':p==='new'?(id?'编辑文章':'添加文章'):p==='view'?'文章阅读':p==='review'?'复习中心':'设置';$('#subtitle').textContent=p==='list'?'你的私人日语文章库':p==='new'?'原图与文字一起保存':p==='view'?'阅读与复习':p==='review'?'集中查看重要笔记':'个人数据备份';window.scrollTo(0,0);render()}
async function render(){try{if(page==='list')await renderList();else if(page==='new')await renderEditor(activeId);else if(page==='view')await renderView(activeId);else if(page==='review')await renderReview();else renderSettings()}catch(e){console.error(e);note('读取失败：'+e.message)}}
async function renderList(){const [arr,papers]=await Promise.all([all(),paperNames()]);app.innerHTML=`<div class="card"><input id="search" placeholder="🔎 搜索标题、日语正文、教材、标签"></div><div class="row" style="margin:18px 3px"><strong>我的文章 · ${arr.length}</strong><div class="row"><select id="filter" style="max-width:140px;padding:8px"><option value="">全部试卷</option><option value="__none__">未归档</option>${papers.map(name=>`<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`).join('')}</select><button class="ghost" id="addPaper">＋ 试卷</button></div></div><div id="results"></div>`;const refresh=()=>{const q=$('#search').value.toLowerCase(),f=$('#filter').value;const data=arr.filter(a=>(!f||(f==='__none__'?!a.paper:a.paper===f))&&[a.title,a.text,a.book,a.tags,a.paper,...(a.notes||[]).map(n=>n.title+' '+n.content)].join(' ').toLowerCase().includes(q));$('#results').innerHTML=data.length?data.map(a=>`<div class="card" data-open="${a.id}"><div class="row"><div style="min-width:0"><div class="title">${a.favorite?'★ ':''}${escapeHTML(a.title||'未命名文章')}</div><p class="sub">${escapeHTML(a.paper||'未归档')} · ${escapeHTML(a.book||'个人收藏')} · ${new Date(a.updated).toLocaleDateString('zh-CN')}</p><div class="preview">${escapeHTML(a.text||'仅保存了原图')}</div></div><span style="font-size:22px;color:#9cabbd">›</span></div></div>`).join(''):`<div class="empty">还没有符合条件的文章。<br>点击底部「添加文章」开始。</div>`;document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>navigate('view',el.dataset.open))};$('#search').oninput=refresh;$('#filter').onchange=refresh;$('#addPaper').onclick=async()=>{const name=await askPaper();if(name)renderList()};refresh()}
async function filesToImages(input){const fs=Array.from(input.files||[]);if(!fs.length)return;for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const blob=await resizeImage(f);photos.push(blob);perPageOCR.push('')}catch(e){photos.push(f);perPageOCR.push('')}}note('已添加 '+fs.length+' 张图片');updateThumbs();/* 手动触发 OCR，避免覆盖或打断 ChatGPT 粘贴 */}
async function resizeImage(file){if(file.size<1800000)return file;let bmp=await createImageBitmap(file);let scale=Math.min(1,1800/Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('图片处理失败')),'image/jpeg',.84))}
function updateThumbs(){let e=$('#thumbs');if(!e)return;originalPhotoUrls.forEach(u=>URL.revokeObjectURL(u));originalPhotoUrls=photos.map(b=>URL.createObjectURL(b));e.innerHTML=originalPhotoUrls.map((u,i)=>`<div style="position:relative;min-width:105px"><img src="${u}" alt="第${i+1}页"><div class="sub">第${i+1}页 <button type="button" data-up="${i}">↑</button><button type="button" data-down="${i}">↓</button></div><button type="button" data-rm="${i}" style="position:absolute;right:3px;top:3px;background:#fff;border:0;border-radius:8px">✕</button></div>`).join('');e.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);perPageOCR.splice(+b.dataset.rm,1);updateThumbs()});e.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.up??b.dataset.down);const j=i+(b.dataset.up!==undefined?-1:1);if(j<0||j>=photos.length)return;[photos[i],photos[j]]=[photos[j],photos[i]];[perPageOCR[i],perPageOCR[j]]=[perPageOCR[j],perPageOCR[i]];updateThumbs();showPageOCR()})}
async function renderEditor(id){const a=id?await one(id):null;const papers=await paperNames();photos=a?[...a.photos]:[];perPageOCR=a?.pageTexts?.slice()||photos.map(()=>'');app.innerHTML=`<button class="back" id="back">‹ 返回</button><div class="card"><div class="tip">拍照或添加照片后会尝试自动识别；多页可继续添加，使用↑↓调整页序。识别会在本机处理，初次使用需联网下载日语识别模型。请对照原图复核，不会自动替换原文。</div><label>文章标题</label><input id="title" placeholder="例如：日本の働き方" value="${escapeHTML(a?.title||'')}"><div class="row"><div style="flex:1"><label>所属试卷</label><div class="row"><select id="paper"><option value="">未归档</option>${papers.map(name=>`<option value="${escapeHTML(name)}" ${a?.paper===name?'selected':''}>${escapeHTML(name)}</option>`).join('')}</select><button type="button" id="newPaper" class="ghost" style="white-space:nowrap">＋ 新试卷</button></div></div><div style="flex:1"><label>教材名称</label><input id="book" placeholder="例如：新完全マスター" value="${escapeHTML(a?.book||'')}"></div></div><label>标签（用逗号分隔）</label><input id="tags" placeholder="社会, 环境, 难题" value="${escapeHTML(a?.tags||'')}"><label>原始图片（可多选或直接拍照）</label><input type="file" id="files" accept="image/*" multiple><div class="thumbRow" id="thumbs" style="margin-top:12px"></div><div class="card" style="background:#f5f8ff;margin:14px 0 8px;padding:12px"><div class="row"><strong>🔍 自动日语识别</strong><select id="ocrDirection" style="max-width:122px"><option value="jpn">横排日语</option></select></div><button type="button" id="autoOCR" class="primary full" style="margin:12px 0">重新识别全部照片（横排）</button><button type="button" id="aiOCR" class="primary full" style="margin:6px 0;background:#167d72">✨ AI 识别并校对照片（联网付费）</button><div id="ocrProgress" role="status" aria-live="polite" class="sub">新照片加入后会自动尝试识别；首次需联网下载模型。</div><div id="ocrCheck" class="tip" style="margin-top:9px">识别后检查会提示可能的错字、断句问题。语义通顺不能仅凭 OCR 保证。</div></div><div class="card" style="background:#f0faf6;padding:12px;margin:12px 0"><strong>📋 从 ChatGPT 一次粘贴导入</strong><p class="sub">请让 ChatGPT 按「【标题】、【正文】、【题目】」整理。也可以直接粘贴全文，再手动调整。</p><textarea id="gptPaste" style="min-height:150px" placeholder="【标题】\n山で熊に出会ったら\n【正文】\n……\n【题目】\n問1 ……"></textarea><button type="button" id="importGPT" class="ghost full">解析并填写文章（不会立即保存）</button><p id="importFeedback" class="sub"></p></div><label>阅读正文（可修改）</label><textarea id="articleText" lang="ja" placeholder="识别后的阅读正文，也可手动修正">${escapeHTML(a?.bodyText??a?.text??'')}</textarea><label>问题与选项（可修改）</label><textarea id="questionText" lang="ja" placeholder="问1、选项①②③④等">${escapeHTML(a?.questionText||'')}</textarea><details class="card"><summary>查看逐页 OCR 原始识别内容（防止漏字）</summary><div id="pageOCR" class="sub"></div></details><div class="tip" style="margin-top:10px">正文和题目会按常见「問」「①②③④」格式尝试拆分；不确定时请对照原图修改。不会通过猜测改写试卷原文。</div><label><input type="checkbox" id="favorite" ${a?.favorite?'checked':''}> 收藏这篇文章</label><label><input type="checkbox" id="review" ${a?.review?'checked':''}> 需要复习</label><button id="save" class="primary full" style="margin-top:16px">保存文章</button></div>`;$('#back').onclick=()=>navigate(id?'view':'list',id);$('#newPaper').onclick=async()=>{const name=await askPaper();if(name){const sel=$('#paper');const opt=document.createElement('option');opt.value=name;opt.textContent=name;sel.append(opt);sel.value=name}};$('#files').onchange=e=>filesToImages(e.target);updateThumbs();showPageOCR();$('#importGPT').onclick=()=>{const raw=$('#gptPaste').value.trim();if(!raw){note('先粘贴 ChatGPT 整理的文字');return}const part=parseGPT(raw);const title=$('#title'),body=$('#articleText'),questions=$('#questionText');if((body.value.trim()||questions.value.trim())&&!confirm('将用粘贴内容替换正文和题目编辑框，确定继续？'))return;if(part.title&&!title.value.trim())title.value=part.title;body.value=part.body;questions.value=part.questions;$('#importFeedback').textContent=part.structured?'已根据分区标记填写，请检查后点击保存文章。':'未检测到完整分区标记，已导入文字草稿，请手动核对正文和题目。';note('已导入草稿，尚未保存')};$('#autoOCR').onclick=runOCR;$('#aiOCR').onclick=runAIPhotoOCR;$('#articleText').addEventListener('input',()=>showOCRCheck($('#articleText').value));if(a?.text)showOCRCheck(a.text);$('#save').onclick=async()=>{const title=$('#title').value.trim(),bodyText=$('#articleText').value.trim(),questionText=$('#questionText').value.trim(),text=[bodyText,questionText].filter(Boolean).join('\n\n');if(!title){note('请填写标题');return}if(!photos.length&&!text){note('请添加至少一张图片或文字');return}const b=$('#save');b.disabled=true;b.textContent='正在保存…';try{const obj={id:id||crypto.randomUUID(),title,paper:$('#paper').value,book:$('#book').value.trim(),tags:$('#tags').value.trim(),text,bodyText,questionText,notes:a?.notes||[],pageTexts:[...perPageOCR],photos:[...photos],favorite:$('#favorite').checked,review:$('#review').checked,created:a?.created||Date.now(),updated:Date.now()};await put(obj);note('已保存');navigate('view',obj.id)}catch(e){note('保存失败：'+e.message);b.disabled=false;b.textContent='保存文章'}}}

function parseGPT(raw){const normalized=raw.replace(/\r\n?/g,'\n');const marks=[...normalized.matchAll(/^\s*(?:【(标题|正文|题目|选择题|问题与选项)】|\[(TITLE|BODY|QUESTIONS)\])\s*$/gm)];if(marks.length){const sections={};for(let i=0;i<marks.length;i++){const k=marks[i][1]||marks[i][2];sections[k]=normalized.slice(marks[i].index+marks[i][0].length,i+1<marks.length?marks[i+1].index:undefined).trim()}const body=sections['正文']||sections.BODY||'';const qs=sections['题目']||sections['选择题']||sections['问题与选项']||sections.QUESTIONS||'';if(body||qs)return {title:sections['标题']||sections.TITLE||'',body,questions:qs,structured:!!(body&&qs)}}const split=splitSections(normalized);return {title:'',body:split.body,questions:split.questions,structured:false}}
// Only explicit question markers trigger separation. Do not fabricate missing words.
function splitSections(raw){
 const lines=raw.split(/\n/);const start=lines.findIndex(l=>/^\s*(?:問\s*[0-9０-９一二三四五六七八九十]+|問題\s*[0-9０-９]+|(?:[①②③④]|[1-4][.．、])\s*[^\n]{3,})/.test(l));
 if(start<0)return {body:raw.trim(),questions:''};
 return {body:lines.slice(0,start).join('\n').trim(),questions:lines.slice(start).join('\n').trim()};
}
function showPageOCR(){const el=$('#pageOCR');if(!el)return;el.innerHTML=perPageOCR.length?perPageOCR.map((s,i)=>'<details style="margin:10px 0"><summary>第 '+(i+1)+' 页 · '+(s?'已识别':'未识别')+'</summary><pre style="white-space:pre-wrap;word-break:break-word">'+escapeHTML(s||'（暂无识别文字）')+'</pre></details>').join(''):'尚无照片';}
// OCR results are a draft only; originals are always retained. No remote AI requests.
async function getOCRWorker(lang){
  if(!window.Tesseract){
    const tag=document.createElement('script');tag.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    await new Promise((resolve,reject)=>{tag.onload=resolve;tag.onerror=()=>reject(Error('OCR 引擎下载失败，请检查网络'));document.head.appendChild(tag)});
  }
  if(ocrWorker && ocrWorker.lang===lang)return ocrWorker.worker;
  if(ocrWorker){await ocrWorker.worker.terminate();ocrWorker=null}
  const w=await Tesseract.createWorker(lang,1,{logger:m=>{const e=$('#ocrProgress');if(e&&m.status==='recognizing text')e.textContent='正在识别 · '+Math.round((m.progress||0)*100)+'%'}});
  ocrWorker={lang,worker:w};return w;
}
function analyzeOCR(text){
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean), warnings=[];
  const odd=lines.filter(x=>/[�□■]{1,}|[|]{2,}|[A-Za-z0-9][぀-ヿ][A-Za-z0-9]/.test(x));
  if(odd.length)warnings.push('发现 '+odd.length+' 行可能存在乱码、混排错误或异常字符');
  const tiny=lines.filter(x=>x.length<=2&& !/^[①-⑳0-9一二三四五六七八九十]+[.．、]?$/.test(x));
  if(tiny.length>=2)warnings.push('检测到多个很短的行，可能有断行或识别顺序问题');
  if(text.replace(/\s/g,'').length<20)warnings.push('识别内容较少，请检查照片是否清晰、方向是否选对');
  if(/(?:。|、|，|．){2,}/.test(text))warnings.push('标点可能有重复');
  if(!warnings.length)warnings.push('未发现明显的格式异常，但不代表字词、语法或语义全部正确');
  return warnings;
}
function showOCRCheck(text){const box=$('#ocrCheck');if(!box)return;box.innerHTML='<strong>初步自动检查：</strong><ul style="padding-left:20px;margin:7px 0">'+analyzeOCR(text).map(w=>'<li>'+escapeHTML(w)+'</li>').join('')+'</ul><small>这是规则检查，不是 AI 语义审校。请对照原图确认后保存。</small>'}
async function runOCR(){
  if(ocrRunning)return;
  if(!photos.length){note('请先拍摄或添加照片');return}
  const textarea=$('#articleText'),btn=$('#autoOCR'),status=$('#ocrProgress');
  if((textarea.value.trim()||$('#questionText').value.trim())&&!confirm('自动识别将替换当前正文和题目编辑内容。请先保存已校对的修改。继续吗？'))return;
  ocrRunning=true;btn.disabled=true;btn.textContent='正在识别…';
  try{
    status.textContent='正在载入日语识别模型（首次需要联网）…';
    const worker=await getOCRWorker($('#ocrDirection').value);
    const texts=[];
    for(let i=0;i<photos.length;i++){
      status.textContent='正在识别第 '+(i+1)+' / '+photos.length+' 页…';
      const url=URL.createObjectURL(photos[i]);
      try{const result=await worker.recognize(url);texts.push((result.data.text||'').trim())}finally{URL.revokeObjectURL(url)}
    }
    perPageOCR=texts;const text=texts.filter(Boolean).join('\n\n');const split=splitSections(text);textarea.value=split.body;$('#questionText').value=split.questions;showPageOCR();showOCRCheck(text);
    status.textContent=text?'已完成 '+photos.length+' 页识别。请核对文字并点击底部「保存文章」。':'未识别出文字，请检查图片、方向和光线';
    if(text)note('识别完成，请检查结果');
  }catch(e){status.textContent='识别失败：'+e.message+'。可以再试一次，或手动粘贴文字。';console.error(e)}
  finally{ocrRunning=false;btn.disabled=false;btn.textContent='重新识别全部照片（横排）'}
}

async function renderView(id){const a=await one(id);if(!a){navigate('list');return}readMode='text';app.innerHTML=`<button class="back" id="back">‹ 文章库</button><div class="row"><div><div class="title" style="font-size:22px">${escapeHTML(a.title)}</div><p class="sub">${escapeHTML(a.paper||'未归档')} · ${escapeHTML(a.book||'未指定教材')} · ${a.photos.length} 页</p></div><button class="ghost" id="fav">${a.favorite?'★ 已收藏':'☆ 收藏'}</button></div><div class="switch" style="margin:16px 0"><button id="textMode" class="active">📖 文字模式</button><button id="imageMode">🖼 原图模式</button></div><div id="reading" class="card"></div><div class="card"><div class="row"><strong>📝 本篇学习笔记</strong><span id="noteCount" class="pill"></span></div><p class="sub">从 ChatGPT 复制值得复习的解释，添加到这篇文章下面。</p><div id="notesList"></div><label>笔记标题</label><input id="noteTitle" placeholder="例如：とは限らない 的含义"><label>笔记分类</label><select id="noteType"><option>语法</option><option>词汇</option><option>错题解析</option><option>阅读技巧</option><option>其他</option></select><label>复制的 ChatGPT 回答或自己的总结</label><textarea id="noteBody" style="min-height:150px" placeholder="在 ChatGPT 中复制解释，再回到这里粘贴……"></textarea><label><input type="checkbox" id="noteImportant"> 加入重点复习</label><button id="addNote" class="primary full">保存学习笔记</button></div><details class="card"><summary>可选：独立 API 问答（需要另行配置，可能收费）</summary><div style="margin-top:12px"><strong>✨ AI 日语阅读老师</strong><label>提问内容</label><textarea id="aiQuestion" style="min-height:90px" placeholder="例如：为什么第2题选择2？请结合原文解释。"></textarea><label><input type="checkbox" id="aiHints" checked> 先提示，不直接公布答案</label><button id="askAI" class="primary full">向 AI 提问（联网付费）</button><div id="aiAnswer" class="article" style="font-size:15px;margin-top:12px" aria-live="polite"></div></div></details><div class="row"><button class="ghost" id="edit">✎ 编辑</button><button class="ghost" id="toggleReview">${a.review?'✓ 待复习':'标记待复习'}</button><button class="ghost danger" id="delete">删除</button></div>`;const objs=[];function display(){objs.forEach(u=>URL.revokeObjectURL(u));objs.length=0;$('#textMode').classList.toggle('active',readMode==='text');$('#imageMode').classList.toggle('active',readMode==='image');if(readMode==='text'){$('#reading').innerHTML=`<div class="row" style="margin-bottom:14px"><span class="sub">可长按选择、复制日语文字</span><button class="ghost" id="size">字号 A${fontSize}</button></div><div class="article" style="font-size:${fontSize}px" lang="ja">${escapeHTML(a.bodyText??a.text??'尚未填写文字。点击「编辑」识别文章。')}${a.questionText?'<hr style="border:0;border-top:1px solid #e8eaf0;margin:24px 0"><strong>问题与选项</strong><div style="margin-top:12px">'+escapeHTML(a.questionText)+'</div>':''}</div>`;$('#size').onclick=()=>{fontSize=fontSize>=24?16:fontSize+2;display()}}else{$('#reading').innerHTML=a.photos.length?`<div class="images">${a.photos.map((b,i)=>{const url=URL.createObjectURL(b);objs.push(url);return `<a href="${url}" target="_blank"><img src="${url}" alt="第${i+1}页原图"></a>`}).join('')}</div>`:'<div class="empty">本篇没有保存原图</div>'}}function paintNotes(){const notes=a.notes||[];$('#noteCount').textContent=notes.length+' 条';$('#notesList').innerHTML=notes.length?notes.map(n=>`<div class="card" style="background:#f7f9fc;margin:10px 0"><div class="row"><strong>${escapeHTML(n.title)}</strong><span class="pill">${escapeHTML(n.type||'其他')}</span></div><div class="article" style="font-size:15px;margin:10px 0">${escapeHTML(n.content)}</div><div class="row"><button class="ghost" data-priority="${n.id}">${n.important?'★ 重点复习':'☆ 标记重点'}</button><button class="ghost danger" data-remove-note="${n.id}">删除</button></div></div>`).join(''):'<p class="sub">还没有笔记，粘贴 ChatGPT 的解释即可添加。</p>';$('#notesList').querySelectorAll('[data-priority]').forEach(b=>b.onclick=async()=>{const n=a.notes.find(x=>x.id===b.dataset.priority);if(!n)return;n.important=!n.important;a.updated=Date.now();await put(a);paintNotes()});$('#notesList').querySelectorAll('[data-remove-note]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条笔记？'))return;a.notes=a.notes.filter(x=>x.id!==b.dataset.removeNote);a.updated=Date.now();await put(a);paintNotes()})}$('#addNote').onclick=async()=>{const title=$('#noteTitle').value.trim(),content=$('#noteBody').value.trim();if(!title||!content){note('请填写笔记标题和内容');return}a.notes=a.notes||[];a.notes.push({id:crypto.randomUUID(),title,content,type:$('#noteType').value,important:$('#noteImportant').checked,created:Date.now()});a.updated=Date.now();try{await put(a);$('#noteTitle').value='';$('#noteBody').value='';$('#noteImportant').checked=false;paintNotes();note('笔记已保存')}catch(e){note('笔记保存失败：'+e.message)}};paintNotes();$('#askAI').onclick=async()=>{const b=$('#askAI'), q=$('#aiQuestion').value.trim();if(!q){note('请输入问题');return}b.disabled=true;$('#aiAnswer').textContent='正在思考…';try{const j=await aiRequest({mode:'chat',question:q,hints:$('#aiHints').checked,article:(a.bodyText||a.text||'').slice(0,26000),questions:(a.questionText||'').slice(0,14000)});$('#aiAnswer').textContent=j.text||'无回答'}catch(e){$('#aiAnswer').textContent='请求失败：'+e.message}finally{b.disabled=false}};$('#textMode').onclick=()=>{readMode='text';display()};$('#imageMode').onclick=()=>{readMode='image';display()};$('#back').onclick=()=>navigate('list');$('#edit').onclick=()=>navigate('new',id);$('#fav').onclick=async()=>{a.favorite=!a.favorite;a.updated=Date.now();await put(a);$('#fav').textContent=a.favorite?'★ 已收藏':'☆ 收藏'};$('#toggleReview').onclick=async()=>{a.review=!a.review;a.updated=Date.now();await put(a);$('#toggleReview').textContent=a.review?'✓ 待复习':'标记待复习'};$('#delete').onclick=async()=>{if(confirm('确定删除这篇文章及全部照片？此操作无法撤销。')){await del(id);navigate('list')}};display()}
async function renderReview(){const articles=await all();const rows=articles.flatMap(a=>(a.notes||[]).filter(n=>n.important).map(n=>({a,n})));app.innerHTML=`<div class="card"><strong>⭐ 重点复习 · ${rows.length} 条</strong><p class="sub">所有试卷的重点笔记集中显示。点开对应文章可以修改笔记。</p></div><div id="reviewNotes">${rows.length?rows.map(({a,n})=>`<div class="card"><span class="pill">${escapeHTML(a.paper||'未归档')}</span> <span class="pill">${escapeHTML(n.type||'其他')}</span><h3>${escapeHTML(n.title)}</h3><div class="article" style="font-size:15px">${escapeHTML(n.content)}</div><button class="ghost" data-review-open="${a.id}" style="margin-top:14px">打开：${escapeHTML(a.title)}</button></div>`).join(''):'<div class="empty">暂无重点复习笔记。进入文章，添加笔记并勾选「加入重点复习」。</div>'}</div>`;app.querySelectorAll('[data-review-open]').forEach(b=>b.onclick=()=>navigate('view',b.dataset.reviewOpen))}
const blobAsData=blob=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});function dataAsBlob(s){const [a,b]=s.split(',');const mime=(a.match(/data:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b), arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function renderSettings(){app.innerHTML=`<div class="card stack"><h3 style="margin:0">AI 接口设置</h3><p class="sub">仅填写 Cloudflare Worker 地址和访问口令。不要在这里输入 OpenAI API Key；API Key 只保存在 Cloudflare Secret 中。口令只保留至本次页面会话结束。</p><label>Worker 网址</label><input id="aiEndpoint" type="url" placeholder="https://xxx.yourname.workers.dev" value="${escapeHTML(localStorage.getItem('nr-ai-endpoint')||'')}"><label>访问口令（不要使用你的常用密码）</label><input id="aiPassword" type="password" placeholder="Cloudflare 中的 APP_PASSWORD"><button id="saveAIConfig" class="ghost">保存接口地址</button><div class="tip">未配置后端之前，AI 按钮无法使用。照片仅在主动点击 AI 识别时发送给后端。为保护费用，后端必须增加速率限制或 Cloudflare Access。</div></div><div class="card stack"><h3 style="margin:0">备份与恢复</h3><p class="sub">文章和照片默认保存在本机浏览器数据中，不会自动上传到服务器。请定期备份到 iPhone「文件」或 iCloud Drive。</p><button id="export" class="primary">导出完整备份（JSON）</button><label>从备份恢复</label><input type="file" id="import" accept=".json,application/json"><div class="tip">恢复采用「按文章 ID 合并」，同 ID 文章会被备份内容覆盖。大型照片库可能导出较大的文件，请保持足够存储空间。</div></div><div class="card"><strong>关于当前版本</strong><p class="sub">版本 v0.6 · ChatGPT 粘贴导入、学习笔记、重点复习；保留可选 AI 接口、横排自动 OCR、多页连拍、正文与选择题分区、完整原图、备份。</p><p class="sub">OCR 仅针对横排日语，需联网加载模型。正文和题目分离依赖格式规则，可能不准确；真正的 AI 语义校对尚未开发。</p></div>`;$('#saveAIConfig').onclick=()=>{localStorage.setItem('nr-ai-endpoint',$('#aiEndpoint').value.trim().replace(/\/$/,''));sessionStorage.setItem('nr-ai-password',$('#aiPassword').value);note('已保存接口地址与本次会话口令')};$('#export').onclick=async()=>{const b=$('#export');b.disabled=true;b.textContent='正在打包备份…';try{let items=await all();for(const a of items)a.photos=await Promise.all(a.photos.map(blobAsData));const payload={app:'nihongo-reader',version:3,exportedAt:new Date().toISOString(),papers:await paperNames(),articles:items};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='日语阅读手帐备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);note('请将下载文件保存至「文件」App')}catch(e){note('备份失败：'+e.message)}finally{b.disabled=false;b.textContent='导出完整备份（JSON）'}};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='nihongo-reader'||!Array.isArray(data.articles))throw Error('不是有效的备份文件');if(!confirm(`将恢复 ${data.articles.length} 篇文章，可能覆盖相同 ID 的记录。继续吗？`))return;for(const name of (data.papers||[])){if(typeof name==='string')await addPaper(name)}for(const a of data.articles){if(!a.id||!Array.isArray(a.photos))continue;a.photos=a.photos.map(dataAsBlob);await put(a)}note('备份恢复成功');navigate('list')}catch(err){note('恢复失败：'+err.message)}}}
async function aiRequest(payload){
 const url=(localStorage.getItem('nr-ai-endpoint')||'').replace(/\/$/,'');
 const password=sessionStorage.getItem('nr-ai-password')||'';
 if(!/^https:\/\/[^/]+/.test(url)||!password)throw Error('请先到「设置」填写 Worker 地址和访问口令');
 const r=await fetch(url+'/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-App-Password':password},body:JSON.stringify(payload)});
 let data;try{data=await r.json()}catch{throw Error('服务器返回格式错误')}
 if(!r.ok)throw Error(data.error||('HTTP '+r.status));return data;
}
async function runAIPhotoOCR(){
 if(!photos.length){note('请先拍照或导入照片');return}
 if(photos.length>6){note('每次最多识别6页，请拆分识别');return}
 if(($('#articleText').value.trim()||$('#questionText').value.trim())&&!confirm('AI 识别将替换目前正文和题目草稿，请先保存修改。继续吗？'))return;
 const btn=$('#aiOCR'),status=$('#ocrProgress');btn.disabled=true;status.textContent='正在准备上传照片…';
 try{
  const images=[];for(let i=0;i<photos.length;i++){
   // Compress for upload only; saved original files remain unchanged.
   const file=await aiCompress(photos[i]);images.push(await blobAsData(file));
  }
  status.textContent='AI 正在对照原图识别日语，请勿切换页面…';
  const j=await aiRequest({mode:'ocr',images});
  $('#articleText').value=j.body||'';$('#questionText').value=j.questions||'';
  perPageOCR=Array.isArray(j.pages)?j.pages:perPageOCR;
  showPageOCR();showOCRCheck([j.body,j.questions].join('\n'));
  status.textContent='AI 识别完成：'+(j.warnings||'请逐行对照原图复核，尤其是数字、否定词及选项。');
  note('AI 文字草稿已生成；检查后记得保存文章');
 }catch(e){status.textContent='AI 识别失败：'+e.message}finally{btn.disabled=false}
}
async function aiCompress(blob){
 const bmp=await createImageBitmap(blob),maxSide=2000,s=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();
 return new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(Error('压缩失败')),'image/jpeg',.88));
}

:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172033;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#f4f5f7ed;backdrop-filter:blur(16px);padding:calc(16px + env(safe-area-inset-top)) 20px 12px;z-index:10;border-bottom:1px solid #e4e7ed}h1{font-size:24px;margin:0 0 4px}small,.muted{color:#748094}.wrap{max-width:650px;margin:auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}.card{background:white;border-radius:18px;padding:17px;margin:0 0 12px;box-shadow:0 2px 10px #19283b08}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#eff3f9;border-radius:999px;padding:5px 10px;font-size:12px;color:#516783}.primary{background:#2665e8;color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:650}.ghost{background:#eef2f8;color:#183454;border:0;border-radius:12px;padding:10px 13px}.danger{color:#bf3446}.full{width:100%}input:not([type=file]),select,textarea{width:100%;background:white;border:1px solid #d9dfea;border-radius:12px;padding:12px;outline:none}textarea{min-height:210px;resize:vertical;line-height:1.8}label{display:block;font-size:13px;color:#5e6b7d;margin:14px 0 7px}nav{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid #e6eaf0;display:flex;gap:12px;z-index:20}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#f4f5f7;color:#56657b}nav button.active{background:#e0eafe;color:#2059cc;font-weight:700}.title{font-size:17px;font-weight:650}.preview{white-space:pre-line;color:#64748b;font-size:13px;line-height:1.6;max-height:38px;overflow:hidden}.article{white-space:pre-wrap;line-height:1.95;word-break:break-word;font-size:18px}.images img{width:100%;display:block;border-radius:9px;margin:0 0 13px}.switch{display:flex;gap:7px;background:#e7ebf1;border-radius:14px;padding:5px}.switch button{border:0;border-radius:10px;flex:1;padding:11px;background:transparent}.switch .active{background:white;font-weight:700;box-shadow:0 2px 4px #0001}.hidden{display:none!important}.empty{text-align:center;color:#718096;padding:65px 10px}.sub{font-size:13px;color:#728095}.imageThumb{width:70px;height:86px;object-fit:cover;border-radius:10px;background:#f0f2f6}.thumbRow{display:flex;gap:10px;overflow:auto}.thumbRow img{height:100px;border-radius:9px}.tip{background:#eef4ff;padding:12px;border-radius:12px;font-size:13px;color:#425b83;line-height:1.6}.back{background:none;border:0;color:#2764da;padding:0;margin-bottom:12px}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:99;max-width:90vw;text-align:center}
</style></head><body><header><div style="max-width:650px;margin:auto"><h1 id="heading">日语阅读手帐</h1><small id="subtitle">把每一篇阅读留在这里</small></div></header><main class="wrap" id="app"></main><nav id="nav"><button data-page="list" class="active">📚 文章库</button><button data-page="new">＋ 添加文章</button><button data-page="settings">⚙️ 设置</button></nav><div id="toast"></div><script>
'use strict';const DB='nihongo-reader-01', STORE='articles', PAPERS='papers';let perPageOCR=[], db, page='list', activeId=null, readMode='text', photos=[], originalPhotoUrls=[], fontSize=18, ocrWorker=null, ocrRunning=false;
const $=s=>document.querySelector(s), app=$('#app');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const note=t=>{let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2700)};
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}function txStore(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}async function all(){return (await request(txStore().getAll())).sort((a,b)=>b.updated-a.updated)}async function one(id){return request(txStore().get(id))}async function put(a){return request(txStore('readwrite').put(a))}async function del(id){return request(txStore('readwrite').delete(id))}
async function paperNames(){return (await request(db.transaction(PAPERS).objectStore(PAPERS).getAll())).map(x=>x.name).sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}))}
async function addPaper(name){name=name.trim();if(!name)throw Error('请输入试卷名称');await request(db.transaction(PAPERS,'readwrite').objectStore(PAPERS).put({name}));return name}
async function askPaper(){const name=prompt('新试卷名称（例如：试卷三）');if(name===null)return null;try{return await addPaper(name)}catch(e){note(e.message);return null}}
function navigate(p,id){page=p;activeId=id??null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#heading').textContent=p==='list'?'日语阅读手帐':p==='new'?(id?'编辑文章':'添加文章'):p==='view'?'文章阅读':'设置';$('#subtitle').textContent=p==='list'?'你的私人日语文章库':p==='new'?'原图与文字一起保存':p==='view'?'阅读与复习':'个人数据备份';window.scrollTo(0,0);render()}
async function render(){try{if(page==='list')await renderList();else if(page==='new')await renderEditor(activeId);else if(page==='view')await renderView(activeId);else renderSettings()}catch(e){console.error(e);note('读取失败：'+e.message)}}
async function renderList(){const [arr,papers]=await Promise.all([all(),paperNames()]);app.innerHTML=`<div class="card"><input id="search" placeholder="🔎 搜索标题、日语正文、教材、标签"></div><div class="row" style="margin:18px 3px"><strong>我的文章 · ${arr.length}</strong><div class="row"><select id="filter" style="max-width:140px;padding:8px"><option value="">全部试卷</option><option value="__none__">未归档</option>${papers.map(name=>`<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`).join('')}</select><button class="ghost" id="addPaper">＋ 试卷</button></div></div><div id="results"></div>`;const refresh=()=>{const q=$('#search').value.toLowerCase(),f=$('#filter').value;const data=arr.filter(a=>(!f||(f==='__none__'?!a.paper:a.paper===f))&&[a.title,a.text,a.book,a.tags,a.paper].join(' ').toLowerCase().includes(q));$('#results').innerHTML=data.length?data.map(a=>`<div class="card" data-open="${a.id}"><div class="row"><div style="min-width:0"><div class="title">${a.favorite?'★ ':''}${escapeHTML(a.title||'未命名文章')}</div><p class="sub">${escapeHTML(a.paper||'未归档')} · ${escapeHTML(a.book||'个人收藏')} · ${new Date(a.updated).toLocaleDateString('zh-CN')}</p><div class="preview">${escapeHTML(a.text||'仅保存了原图')}</div></div><span style="font-size:22px;color:#9cabbd">›</span></div></div>`).join(''):`<div class="empty">还没有符合条件的文章。<br>点击底部「添加文章」开始。</div>`;document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>navigate('view',el.dataset.open))};$('#search').oninput=refresh;$('#filter').onchange=refresh;$('#addPaper').onclick=async()=>{const name=await askPaper();if(name)renderList()};refresh()}
async function filesToImages(input){const fs=Array.from(input.files||[]);if(!fs.length)return;for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const blob=await resizeImage(f);photos.push(blob);perPageOCR.push('')}catch(e){photos.push(f);perPageOCR.push('')}}note('已添加 '+fs.length+' 张图片');updateThumbs();if(!ocrRunning && $('#autoOCR'))runOCR()}
async function resizeImage(file){if(file.size<1800000)return file;let bmp=await createImageBitmap(file);let scale=Math.min(1,1800/Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('图片处理失败')),'image/jpeg',.84))}
function updateThumbs(){let e=$('#thumbs');if(!e)return;originalPhotoUrls.forEach(u=>URL.revokeObjectURL(u));originalPhotoUrls=photos.map(b=>URL.createObjectURL(b));e.innerHTML=originalPhotoUrls.map((u,i)=>`<div style="position:relative;min-width:105px"><img src="${u}" alt="第${i+1}页"><div class="sub">第${i+1}页 <button type="button" data-up="${i}">↑</button><button type="button" data-down="${i}">↓</button></div><button type="button" data-rm="${i}" style="position:absolute;right:3px;top:3px;background:#fff;border:0;border-radius:8px">✕</button></div>`).join('');e.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);perPageOCR.splice(+b.dataset.rm,1);updateThumbs()});e.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.up??b.dataset.down);const j=i+(b.dataset.up!==undefined?-1:1);if(j<0||j>=photos.length)return;[photos[i],photos[j]]=[photos[j],photos[i]];[perPageOCR[i],perPageOCR[j]]=[perPageOCR[j],perPageOCR[i]];updateThumbs();showPageOCR()})}
async function renderEditor(id){const a=id?await one(id):null;const papers=await paperNames();photos=a?[...a.photos]:[];perPageOCR=a?.pageTexts?.slice()||photos.map(()=>'');app.innerHTML=`<button class="back" id="back">‹ 返回</button><div class="card"><div class="tip">拍照或添加照片后会尝试自动识别；多页可继续添加，使用↑↓调整页序。识别会在本机处理，初次使用需联网下载日语识别模型。请对照原图复核，不会自动替换原文。</div><label>文章标题</label><input id="title" placeholder="例如：日本の働き方" value="${escapeHTML(a?.title||'')}"><div class="row"><div style="flex:1"><label>所属试卷</label><div class="row"><select id="paper"><option value="">未归档</option>${papers.map(name=>`<option value="${escapeHTML(name)}" ${a?.paper===name?'selected':''}>${escapeHTML(name)}</option>`).join('')}</select><button type="button" id="newPaper" class="ghost" style="white-space:nowrap">＋ 新试卷</button></div></div><div style="flex:1"><label>教材名称</label><input id="book" placeholder="例如：新完全マスター" value="${escapeHTML(a?.book||'')}"></div></div><label>标签（用逗号分隔）</label><input id="tags" placeholder="社会, 环境, 难题" value="${escapeHTML(a?.tags||'')}"><label>原始图片（可多选或直接拍照）</label><input type="file" id="files" accept="image/*" multiple><div class="thumbRow" id="thumbs" style="margin-top:12px"></div><div class="card" style="background:#f5f8ff;margin:14px 0 8px;padding:12px"><div class="row"><strong>🔍 自动日语识别</strong><select id="ocrDirection" style="max-width:122px"><option value="jpn">横排日语</option></select></div><button type="button" id="autoOCR" class="primary full" style="margin:12px 0">重新识别全部照片（横排）</button><div id="ocrProgress" role="status" aria-live="polite" class="sub">新照片加入后会自动尝试识别；首次需联网下载模型。</div><div id="ocrCheck" class="tip" style="margin-top:9px">识别后检查会提示可能的错字、断句问题。语义通顺不能仅凭 OCR 保证。</div></div><label>阅读正文（可修改）</label><textarea id="articleText" lang="ja" placeholder="识别后的阅读正文，也可手动修正">${escapeHTML(a?.bodyText??a?.text??'')}</textarea><label>问题与选项（可修改）</label><textarea id="questionText" lang="ja" placeholder="问1、选项①②③④等">${escapeHTML(a?.questionText||'')}</textarea><details class="card"><summary>查看逐页 OCR 原始识别内容（防止漏字）</summary><div id="pageOCR" class="sub"></div></details><div class="tip" style="margin-top:10px">正文和题目会按常见「問」「①②③④」格式尝试拆分；不确定时请对照原图修改。不会通过猜测改写试卷原文。</div><label><input type="checkbox" id="favorite" ${a?.favorite?'checked':''}> 收藏这篇文章</label><label><input type="checkbox" id="review" ${a?.review?'checked':''}> 需要复习</label><button id="save" class="primary full" style="margin-top:16px">保存文章</button></div>`;$('#back').onclick=()=>navigate(id?'view':'list',id);$('#newPaper').onclick=async()=>{const name=await askPaper();if(name){const sel=$('#paper');const opt=document.createElement('option');opt.value=name;opt.textContent=name;sel.append(opt);sel.value=name}};$('#files').onchange=e=>filesToImages(e.target);updateThumbs();showPageOCR();$('#autoOCR').onclick=runOCR;$('#articleText').addEventListener('input',()=>showOCRCheck($('#articleText').value));if(a?.text)showOCRCheck(a.text);$('#save').onclick=async()=>{const title=$('#title').value.trim(),bodyText=$('#articleText').value.trim(),questionText=$('#questionText').value.trim(),text=[bodyText,questionText].filter(Boolean).join('\n\n');if(!title){note('请填写标题');return}if(!photos.length&&!text){note('请添加至少一张图片或文字');return}const b=$('#save');b.disabled=true;b.textContent='正在保存…';try{const obj={id:id||crypto.randomUUID(),title,paper:$('#paper').value,book:$('#book').value.trim(),tags:$('#tags').value.trim(),text,bodyText,questionText,pageTexts:[...perPageOCR],photos:[...photos],favorite:$('#favorite').checked,review:$('#review').checked,created:a?.created||Date.now(),updated:Date.now()};await put(obj);note('已保存');navigate('view',obj.id)}catch(e){note('保存失败：'+e.message);b.disabled=false;b.textContent='保存文章'}}}

// Only explicit question markers trigger separation. Do not fabricate missing words.
function splitSections(raw){
 const lines=raw.split(/\n/);const start=lines.findIndex(l=>/^\s*(?:問\s*[0-9０-９一二三四五六七八九十]+|問題\s*[0-9０-９]+|(?:[①②③④]|[1-4][.．、])\s*[^\n]{3,})/.test(l));
 if(start<0)return {body:raw.trim(),questions:''};
 return {body:lines.slice(0,start).join('\n').trim(),questions:lines.slice(start).join('\n').trim()};
}
function showPageOCR(){const el=$('#pageOCR');if(!el)return;el.innerHTML=perPageOCR.length?perPageOCR.map((s,i)=>'<details style="margin:10px 0"><summary>第 '+(i+1)+' 页 · '+(s?'已识别':'未识别')+'</summary><pre style="white-space:pre-wrap;word-break:break-word">'+escapeHTML(s||'（暂无识别文字）')+'</pre></details>').join(''):'尚无照片';}
// OCR results are a draft only; originals are always retained. No remote AI requests.
async function getOCRWorker(lang){
  if(!window.Tesseract){
    const tag=document.createElement('script');tag.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    await new Promise((resolve,reject)=>{tag.onload=resolve;tag.onerror=()=>reject(Error('OCR 引擎下载失败，请检查网络'));document.head.appendChild(tag)});
  }
  if(ocrWorker && ocrWorker.lang===lang)return ocrWorker.worker;
  if(ocrWorker){await ocrWorker.worker.terminate();ocrWorker=null}
  const w=await Tesseract.createWorker(lang,1,{logger:m=>{const e=$('#ocrProgress');if(e&&m.status==='recognizing text')e.textContent='正在识别 · '+Math.round((m.progress||0)*100)+'%'}});
  ocrWorker={lang,worker:w};return w;
}
function analyzeOCR(text){
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean), warnings=[];
  const odd=lines.filter(x=>/[�□■]{1,}|[|]{2,}|[A-Za-z0-9][぀-ヿ][A-Za-z0-9]/.test(x));
  if(odd.length)warnings.push('发现 '+odd.length+' 行可能存在乱码、混排错误或异常字符');
  const tiny=lines.filter(x=>x.length<=2&& !/^[①-⑳0-9一二三四五六七八九十]+[.．、]?$/.test(x));
  if(tiny.length>=2)warnings.push('检测到多个很短的行，可能有断行或识别顺序问题');
  if(text.replace(/\s/g,'').length<20)warnings.push('识别内容较少，请检查照片是否清晰、方向是否选对');
  if(/(?:。|、|，|．){2,}/.test(text))warnings.push('标点可能有重复');
  if(!warnings.length)warnings.push('未发现明显的格式异常，但不代表字词、语法或语义全部正确');
  return warnings;
}
function showOCRCheck(text){const box=$('#ocrCheck');if(!box)return;box.innerHTML='<strong>初步自动检查：</strong><ul style="padding-left:20px;margin:7px 0">'+analyzeOCR(text).map(w=>'<li>'+escapeHTML(w)+'</li>').join('')+'</ul><small>这是规则检查，不是 AI 语义审校。请对照原图确认后保存。</small>'}
async function runOCR(){
  if(ocrRunning)return;
  if(!photos.length){note('请先拍摄或添加照片');return}
  const textarea=$('#articleText'),btn=$('#autoOCR'),status=$('#ocrProgress');
  if((textarea.value.trim()||$('#questionText').value.trim())&&!confirm('自动识别将替换当前正文和题目编辑内容。请先保存已校对的修改。继续吗？'))return;
  ocrRunning=true;btn.disabled=true;btn.textContent='正在识别…';
  try{
    status.textContent='正在载入日语识别模型（首次需要联网）…';
    const worker=await getOCRWorker($('#ocrDirection').value);
    const texts=[];
    for(let i=0;i<photos.length;i++){
      status.textContent='正在识别第 '+(i+1)+' / '+photos.length+' 页…';
      const url=URL.createObjectURL(photos[i]);
      try{const result=await worker.recognize(url);texts.push((result.data.text||'').trim())}finally{URL.revokeObjectURL(url)}
    }
    perPageOCR=texts;const text=texts.filter(Boolean).join('\n\n');const split=splitSections(text);textarea.value=split.body;$('#questionText').value=split.questions;showPageOCR();showOCRCheck(text);
    status.textContent=text?'已完成 '+photos.length+' 页识别。请核对文字并点击底部「保存文章」。':'未识别出文字，请检查图片、方向和光线';
    if(text)note('识别完成，请检查结果');
  }catch(e){status.textContent='识别失败：'+e.message+'。可以再试一次，或手动粘贴文字。';console.error(e)}
  finally{ocrRunning=false;btn.disabled=false;btn.textContent='重新识别全部照片（横排）'}
}

async function renderView(id){const a=await one(id);if(!a){navigate('list');return}readMode='text';app.innerHTML=`<button class="back" id="back">‹ 文章库</button><div class="row"><div><div class="title" style="font-size:22px">${escapeHTML(a.title)}</div><p class="sub">${escapeHTML(a.paper||'未归档')} · ${escapeHTML(a.book||'未指定教材')} · ${a.photos.length} 页</p></div><button class="ghost" id="fav">${a.favorite?'★ 已收藏':'☆ 收藏'}</button></div><div class="switch" style="margin:16px 0"><button id="textMode" class="active">📖 文字模式</button><button id="imageMode">🖼 原图模式</button></div><div id="reading" class="card"></div><div class="row"><button class="ghost" id="edit">✎ 编辑</button><button class="ghost" id="toggleReview">${a.review?'✓ 待复习':'标记待复习'}</button><button class="ghost danger" id="delete">删除</button></div>`;const objs=[];function display(){objs.forEach(u=>URL.revokeObjectURL(u));objs.length=0;$('#textMode').classList.toggle('active',readMode==='text');$('#imageMode').classList.toggle('active',readMode==='image');if(readMode==='text'){$('#reading').innerHTML=`<div class="row" style="margin-bottom:14px"><span class="sub">可长按选择、复制日语文字</span><button class="ghost" id="size">字号 A${fontSize}</button></div><div class="article" style="font-size:${fontSize}px" lang="ja">${escapeHTML(a.bodyText??a.text??'尚未填写文字。点击「编辑」识别文章。')}${a.questionText?'<hr style="border:0;border-top:1px solid #e8eaf0;margin:24px 0"><strong>问题与选项</strong><div style="margin-top:12px">'+escapeHTML(a.questionText)+'</div>':''}</div>`;$('#size').onclick=()=>{fontSize=fontSize>=24?16:fontSize+2;display()}}else{$('#reading').innerHTML=a.photos.length?`<div class="images">${a.photos.map((b,i)=>{const url=URL.createObjectURL(b);objs.push(url);return `<a href="${url}" target="_blank"><img src="${url}" alt="第${i+1}页原图"></a>`}).join('')}</div>`:'<div class="empty">本篇没有保存原图</div>'}}$('#textMode').onclick=()=>{readMode='text';display()};$('#imageMode').onclick=()=>{readMode='image';display()};$('#back').onclick=()=>navigate('list');$('#edit').onclick=()=>navigate('new',id);$('#fav').onclick=async()=>{a.favorite=!a.favorite;a.updated=Date.now();await put(a);$('#fav').textContent=a.favorite?'★ 已收藏':'☆ 收藏'};$('#toggleReview').onclick=async()=>{a.review=!a.review;a.updated=Date.now();await put(a);$('#toggleReview').textContent=a.review?'✓ 待复习':'标记待复习'};$('#delete').onclick=async()=>{if(confirm('确定删除这篇文章及全部照片？此操作无法撤销。')){await del(id);navigate('list')}};display()}
const blobAsData=blob=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});function dataAsBlob(s){const [a,b]=s.split(',');const mime=(a.match(/data:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b), arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function renderSettings(){app.innerHTML=`<div class="card stack"><h3 style="margin:0">备份与恢复</h3><p class="sub">文章和照片默认保存在本机浏览器数据中，不会自动上传到服务器。请定期备份到 iPhone「文件」或 iCloud Drive。</p><button id="export" class="primary">导出完整备份（JSON）</button><label>从备份恢复</label><input type="file" id="import" accept=".json,application/json"><div class="tip">恢复采用「按文章 ID 合并」，同 ID 文章会被备份内容覆盖。大型照片库可能导出较大的文件，请保持足够存储空间。</div></div><div class="card"><strong>关于当前版本</strong><p class="sub">版本 v0.4 · 横排自动 OCR、多页连拍、正文与选择题分区、完整原图、备份。</p><p class="sub">OCR 仅针对横排日语，需联网加载模型。正文和题目分离依赖格式规则，可能不准确；真正的 AI 语义校对尚未开发。</p></div>`;$('#export').onclick=async()=>{const b=$('#export');b.disabled=true;b.textContent='正在打包备份…';try{let items=await all();for(const a of items)a.photos=await Promise.all(a.photos.map(blobAsData));const payload={app:'nihongo-reader',version:2,exportedAt:new Date().toISOString(),papers:await paperNames(),articles:items};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='日语阅读手帐备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);note('请将下载文件保存至「文件」App')}catch(e){note('备份失败：'+e.message)}finally{b.disabled=false;b.textContent='导出完整备份（JSON）'}};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='nihongo-reader'||!Array.isArray(data.articles))throw Error('不是有效的备份文件');if(!confirm(`将恢复 ${data.articles.length} 篇文章，可能覆盖相同 ID 的记录。继续吗？`))return;for(const name of (data.papers||[])){if(typeof name==='string')await addPaper(name)}for(const a of data.articles){if(!a.id||!Array.isArray(a.photos))continue;a.photos=a.photos.map(dataAsBlob);await put(a)}note('备份恢复成功');navigate('list')}catch(err){note('恢复失败：'+err.message)}}}
function init(){const req=indexedDB.open(DB,2);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(PAPERS)){const p=d.createObjectStore(PAPERS,{keyPath:'name'});p.put({name:'试卷一'});p.put({name:'试卷二'})}};req.onsuccess=()=>{db=req.result;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));navigate('list')};req.onerror=()=>{app.innerHTML='<div class="empty">无法打开本地数据库，请使用 Safari HTTPS 网站访问，并检查隐私设置。</div>'}}init();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

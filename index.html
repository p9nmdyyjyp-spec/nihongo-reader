<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日语阅读手帐"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>日语阅读手帐</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172033;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#f4f5f7ed;backdrop-filter:blur(16px);padding:calc(16px + env(safe-area-inset-top)) 20px 12px;z-index:10;border-bottom:1px solid #e4e7ed}h1{font-size:24px;margin:0 0 4px}small,.muted{color:#748094}.wrap{max-width:650px;margin:auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}.card{background:white;border-radius:18px;padding:17px;margin:0 0 12px;box-shadow:0 2px 10px #19283b08}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#eff3f9;border-radius:999px;padding:5px 10px;font-size:12px;color:#516783}.primary{background:#2665e8;color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:650}.ghost{background:#eef2f8;color:#183454;border:0;border-radius:12px;padding:10px 13px}.danger{color:#bf3446}.full{width:100%}input:not([type=file]),select,textarea{width:100%;background:white;border:1px solid #d9dfea;border-radius:12px;padding:12px;outline:none}textarea{min-height:210px;resize:vertical;line-height:1.8}label{display:block;font-size:13px;color:#5e6b7d;margin:14px 0 7px}nav{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid #e6eaf0;display:flex;gap:12px;z-index:20}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#f4f5f7;color:#56657b}nav button.active{background:#e0eafe;color:#2059cc;font-weight:700}.title{font-size:17px;font-weight:650}.preview{white-space:pre-line;color:#64748b;font-size:13px;line-height:1.6;max-height:38px;overflow:hidden}.article{white-space:pre-wrap;line-height:1.95;word-break:break-word;font-size:18px}.images img{width:100%;display:block;border-radius:9px;margin:0 0 13px}.switch{display:flex;gap:7px;background:#e7ebf1;border-radius:14px;padding:5px}.switch button{border:0;border-radius:10px;flex:1;padding:11px;background:transparent}.switch .active{background:white;font-weight:700;box-shadow:0 2px 4px #0001}.hidden{display:none!important}.empty{text-align:center;color:#718096;padding:65px 10px}.sub{font-size:13px;color:#728095}.imageThumb{width:70px;height:86px;object-fit:cover;border-radius:10px;background:#f0f2f6}.thumbRow{display:flex;gap:10px;overflow:auto}.thumbRow img{height:100px;border-radius:9px}.tip{background:#eef4ff;padding:12px;border-radius:12px;font-size:13px;color:#425b83;line-height:1.6}.back{background:none;border:0;color:#2764da;padding:0;margin-bottom:12px}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:99;max-width:90vw;text-align:center}
</style></head><body><header><div style="max-width:650px;margin:auto"><h1 id="heading">日语阅读手帐</h1><small id="subtitle">把每一篇阅读留在这里</small></div></header><main class="wrap" id="app"></main><nav id="nav"><button data-page="list" class="active">📚 文章库</button><button data-page="new">＋ 添加文章</button><button data-page="settings">⚙️ 设置</button></nav><div id="toast"></div><script>
'use strict';const DB='nihongo-reader-01', STORE='articles';let db, page='list', activeId=null, readMode='text', photos=[], originalPhotoUrls=[], fontSize=18;
const $=s=>document.querySelector(s), app=$('#app');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const note=t=>{let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2700)};
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}function txStore(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}async function all(){return (await request(txStore().getAll())).sort((a,b)=>b.updated-a.updated)}async function one(id){return request(txStore().get(id))}async function put(a){return request(txStore('readwrite').put(a))}async function del(id){return request(txStore('readwrite').delete(id))}
function navigate(p,id){page=p;activeId=id??null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#heading').textContent=p==='list'?'日语阅读手帐':p==='new'?(id?'编辑文章':'添加文章'):p==='view'?'文章阅读':'设置';$('#subtitle').textContent=p==='list'?'你的私人日语文章库':p==='new'?'原图与文字一起保存':p==='view'?'阅读与复习':'个人数据备份';window.scrollTo(0,0);render()}
async function render(){try{if(page==='list')await renderList();else if(page==='new')await renderEditor(activeId);else if(page==='view')await renderView(activeId);else renderSettings()}catch(e){console.error(e);note('读取失败：'+e.message)}}
async function renderList(){const arr=await all();app.innerHTML=`<div class="card"><input id="search" placeholder="🔎 搜索标题、日语正文、教材、标签"></div><div class="row" style="margin:18px 3px"><strong>我的文章 · ${arr.length}</strong><select id="filter" style="width:122px;padding:8px"><option value="">全部等级</option><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></div><div id="results"></div>`;const refresh=()=>{const q=$('#search').value.toLowerCase(),f=$('#filter').value;const data=arr.filter(a=>(!f||a.level===f)&&[a.title,a.text,a.book,a.tags].join(' ').toLowerCase().includes(q));$('#results').innerHTML=data.length?data.map(a=>`<div class="card" data-open="${a.id}"><div class="row"><div style="min-width:0"><div class="title">${a.favorite?'★ ':''}${escapeHTML(a.title||'未命名文章')}</div><p class="sub">${escapeHTML(a.level||'未分类')} · ${escapeHTML(a.book||'个人收藏')} · ${new Date(a.updated).toLocaleDateString('zh-CN')}</p><div class="preview">${escapeHTML(a.text||'仅保存了原图')}</div></div><span style="font-size:22px;color:#9cabbd">›</span></div></div>`).join(''):`<div class="empty">还没有符合条件的文章。<br>点击底部「添加文章」开始。</div>`;document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>navigate('view',el.dataset.open))};$('#search').oninput=refresh;$('#filter').onchange=refresh;refresh()}
async function filesToImages(input){const fs=Array.from(input.files||[]);if(!fs.length)return;for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const blob=await resizeImage(f);photos.push(blob)}catch(e){photos.push(f)}}note('已添加 '+fs.length+' 张图片');updateThumbs()}
async function resizeImage(file){if(file.size<1800000)return file;let bmp=await createImageBitmap(file);let scale=Math.min(1,1800/Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('图片处理失败')),'image/jpeg',.84))}
function updateThumbs(){let e=$('#thumbs');if(!e)return;originalPhotoUrls.forEach(u=>URL.revokeObjectURL(u));originalPhotoUrls=photos.map(b=>URL.createObjectURL(b));e.innerHTML=originalPhotoUrls.map((u,i)=>`<div style="position:relative"><img src="${u}" alt="第${i+1}页"><button type="button" data-rm="${i}" style="position:absolute;right:3px;top:3px;background:#fff;border:0;border-radius:8px">✕</button></div>`).join('');e.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);updateThumbs()})}
async function renderEditor(id){const a=id?await one(id):null;photos=a?[...a.photos]:[];app.innerHTML=`<button class="back" id="back">‹ 返回</button><div class="card"><div class="tip">第一版暂不自动识别文字。可在 iPhone「照片」里长按选中文字并复制，回到这里粘贴；也可以先只保存原图，之后再补文字。</div><label>文章标题</label><input id="title" placeholder="例如：日本の働き方" value="${escapeHTML(a?.title||'')}"><div class="row"><div style="flex:1"><label>JLPT 等级</label><select id="level">${['未分类','N5','N4','N3','N2','N1'].map(l=>`<option ${a?.level===l?'selected':''}>${l}</option>`).join('')}</select></div><div style="flex:1"><label>教材名称</label><input id="book" placeholder="例如：新完全マスター" value="${escapeHTML(a?.book||'')}"></div></div><label>标签（用逗号分隔）</label><input id="tags" placeholder="社会, 环境, 难题" value="${escapeHTML(a?.tags||'')}"><label>原始图片（可多选或直接拍照）</label><input type="file" id="files" accept="image/*" multiple><div class="thumbRow" id="thumbs" style="margin-top:12px"></div><label>识别后的日语文字（可粘贴、修改）</label><textarea id="articleText" lang="ja" placeholder="把 iPhone 实况文本识别出来的内容粘贴在这里……">${escapeHTML(a?.text||'')}</textarea><label><input type="checkbox" id="favorite" ${a?.favorite?'checked':''}> 收藏这篇文章</label><label><input type="checkbox" id="review" ${a?.review?'checked':''}> 需要复习</label><button id="save" class="primary full" style="margin-top:16px">保存文章</button></div>`;$('#back').onclick=()=>navigate(id?'view':'list',id);$('#files').onchange=e=>filesToImages(e.target);updateThumbs();$('#save').onclick=async()=>{const title=$('#title').value.trim(),text=$('#articleText').value.trim();if(!title){note('请填写标题');return}if(!photos.length&&!text){note('请添加至少一张图片或文字');return}const b=$('#save');b.disabled=true;b.textContent='正在保存…';try{const obj={id:id||crypto.randomUUID(),title,level:$('#level').value,book:$('#book').value.trim(),tags:$('#tags').value.trim(),text,photos:[...photos],favorite:$('#favorite').checked,review:$('#review').checked,created:a?.created||Date.now(),updated:Date.now()};await put(obj);note('已保存');navigate('view',obj.id)}catch(e){note('保存失败：'+e.message);b.disabled=false;b.textContent='保存文章'}}}
async function renderView(id){const a=await one(id);if(!a){navigate('list');return}readMode='text';app.innerHTML=`<button class="back" id="back">‹ 文章库</button><div class="row"><div><div class="title" style="font-size:22px">${escapeHTML(a.title)}</div><p class="sub">${escapeHTML(a.level)} · ${escapeHTML(a.book||'未指定教材')} · ${a.photos.length} 页</p></div><button class="ghost" id="fav">${a.favorite?'★ 已收藏':'☆ 收藏'}</button></div><div class="switch" style="margin:16px 0"><button id="textMode" class="active">📖 文字模式</button><button id="imageMode">🖼 原图模式</button></div><div id="reading" class="card"></div><div class="row"><button class="ghost" id="edit">✎ 编辑</button><button class="ghost" id="toggleReview">${a.review?'✓ 待复习':'标记待复习'}</button><button class="ghost danger" id="delete">删除</button></div>`;const objs=[];function display(){objs.forEach(u=>URL.revokeObjectURL(u));objs.length=0;$('#textMode').classList.toggle('active',readMode==='text');$('#imageMode').classList.toggle('active',readMode==='image');if(readMode==='text'){$('#reading').innerHTML=`<div class="row" style="margin-bottom:14px"><span class="sub">可长按选择、复制日语文字</span><button class="ghost" id="size">字号 A${fontSize}</button></div><div class="article" style="font-size:${fontSize}px" lang="ja">${escapeHTML(a.text||'尚未填写文字。点击「编辑」粘贴 OCR 内容。')}</div>`;$('#size').onclick=()=>{fontSize=fontSize>=24?16:fontSize+2;display()}}else{$('#reading').innerHTML=a.photos.length?`<div class="images">${a.photos.map((b,i)=>{const url=URL.createObjectURL(b);objs.push(url);return `<a href="${url}" target="_blank"><img src="${url}" alt="第${i+1}页原图"></a>`}).join('')}</div>`:'<div class="empty">本篇没有保存原图</div>'}}$('#textMode').onclick=()=>{readMode='text';display()};$('#imageMode').onclick=()=>{readMode='image';display()};$('#back').onclick=()=>navigate('list');$('#edit').onclick=()=>navigate('new',id);$('#fav').onclick=async()=>{a.favorite=!a.favorite;a.updated=Date.now();await put(a);$('#fav').textContent=a.favorite?'★ 已收藏':'☆ 收藏'};$('#toggleReview').onclick=async()=>{a.review=!a.review;a.updated=Date.now();await put(a);$('#toggleReview').textContent=a.review?'✓ 待复习':'标记待复习'};$('#delete').onclick=async()=>{if(confirm('确定删除这篇文章及全部照片？此操作无法撤销。')){await del(id);navigate('list')}};display()}
const blobAsData=blob=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});function dataAsBlob(s){const [a,b]=s.split(',');const mime=(a.match(/data:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b), arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function renderSettings(){app.innerHTML=`<div class="card stack"><h3 style="margin:0">备份与恢复</h3><p class="sub">文章和照片默认保存在本机浏览器数据中，不会自动上传到服务器。请定期备份到 iPhone「文件」或 iCloud Drive。</p><button id="export" class="primary">导出完整备份（JSON）</button><label>从备份恢复</label><input type="file" id="import" accept=".json,application/json"><div class="tip">恢复采用「按文章 ID 合并」，同 ID 文章会被备份内容覆盖。大型照片库可能导出较大的文件，请保持足够存储空间。</div></div><div class="card"><strong>关于第一版</strong><p class="sub">版本 v0.1 · 本地保存、文章搜索、多页图片、文字阅读、收藏、复习、备份。</p><p class="sub">自动 OCR、中文释义、云端同步尚未开发。</p></div>`;$('#export').onclick=async()=>{const b=$('#export');b.disabled=true;b.textContent='正在打包备份…';try{let items=await all();for(const a of items)a.photos=await Promise.all(a.photos.map(blobAsData));const payload={app:'nihongo-reader',version:1,exportedAt:new Date().toISOString(),articles:items};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='日语阅读手帐备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);note('请将下载文件保存至「文件」App')}catch(e){note('备份失败：'+e.message)}finally{b.disabled=false;b.textContent='导出完整备份（JSON）'}};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='nihongo-reader'||!Array.isArray(data.articles))throw Error('不是有效的备份文件');if(!confirm(`将恢复 ${data.articles.length} 篇文章，可能覆盖相同 ID 的记录。继续吗？`))return;for(const a of data.articles){if(!a.id||!Array.isArray(a.photos))continue;a.photos=a.photos.map(dataAsBlob);await put(a)}note('备份恢复成功');navigate('list')}catch(err){note('恢复失败：'+err.message)}}}
function init(){const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>{db=req.result;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));navigate('list')};req.onerror=()=>{app.innerHTML='<div class="empty">无法打开本地数据库，请使用 Safari HTTPS 网站访问，并检查隐私设置。</div>'}}init();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
